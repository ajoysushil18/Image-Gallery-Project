<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature's Canvas - Simple Image Gallery</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="./src/components/gallery.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>Nature's Canvas</h1>
        <p>A simple showcase of beautiful moments in nature.</p>
    </header>

    <!-- Main Content Section -->
    <main class="gallery-container">
        <!-- Single Image Card -->
        <div class="card">
            <div class="card-image">
                <img src="./public/assets/image1.jpg" alt="Serene Mountain Lake at Sunrise">
            </div>
            <div class="card-content">
                <h2>Serene Mountain Sunrise</h2>
                <p>
                    A calm morning view of towering misty mountains reflecting peacefully on the crystal clear lake waters.
                </p>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2026 Nature's Canvas. All rights reserved.</p>
    </footer>

</body>
</html>
